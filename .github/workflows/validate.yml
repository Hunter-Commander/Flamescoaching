name: Validate coaching foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  domain-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/domain.test.mjs
      - run: node --check app.mjs && node --check functions/index.mjs && node --check firebase-client.mjs
      - run: node scripts/build.mjs
